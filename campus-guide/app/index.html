<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guide du campus</title>
<!-- Icône vide : évite que le navigateur demande /favicon.ico (erreur 404 dans la console) -->
<link rel="icon" href="data:,">
<!-- Leaflet est servi en local (dossier vendor/) : aucun accès Internet nécessaire -->
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root { --vert:#1B6E53; --vert-clair:#E8F3EE; --encre:#1F2933; --gris:#5F6B7A; --fond:#F6F8FA; --ligne:#D9E0E6; }
  * { box-sizing: border-box; }
  /* Polices du système uniquement : pas de police web externe */
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--encre); background:var(--fond); }
  header { background:var(--vert); color:#fff; padding:14px 16px; }
  header h1 { margin:0; font-size:19px; }
  header p { margin:4px 0 0; font-size:15px; opacity:.95; }
  main { max-width:720px; margin:0 auto; padding:16px; }
  h2 { font-size:16px; margin:18px 0 10px; color:var(--gris); text-transform:uppercase; letter-spacing:.04em; }
  h2.titre { text-transform:none; letter-spacing:0; color:var(--encre); font-size:18px; }
  /* Grille de gros boutons : 2 colonnes sur un écran de 360 px */
  .grille { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px; }
  button.choix { background:#fff; border:1.5px solid var(--ligne); border-radius:12px; padding:14px 12px; text-align:left;
    font-size:15px; font-weight:600; color:var(--encre); cursor:pointer; min-height:64px; }
  button.choix:hover, button.choix:focus { border-color:var(--vert); outline:none; background:var(--vert-clair); }
  button.choix small { display:block; font-weight:400; color:var(--gris); font-size:12.5px; margin-top:4px; }
  #carte { height:clamp(280px, 85vw, 52vh); border-radius:12px; border:1px solid var(--ligne); background:#E7EFDF; }
  .resume { display:flex; gap:12px; margin:12px 0; }
  .resume div { flex:1; background:#fff; border:1px solid var(--ligne); border-radius:10px; padding:10px 12px; }
  .resume b { display:block; font-size:20px; color:var(--vert); }
  .resume span { font-size:13px; color:var(--gris); }
  .photo { background:#fff; border:1px solid var(--ligne); border-radius:12px; overflow:hidden; margin-top:12px; }
  .photo img { width:100%; display:block; }
  .photo p { margin:0; padding:10px 12px; font-size:14px; }
  ol.etapes { background:#fff; border:1px solid var(--ligne); border-radius:12px; padding:12px 12px 12px 34px; margin:12px 0 0; font-size:14.5px; line-height:1.6; }
  .actions { display:flex; gap:10px; margin-top:14px; }
  .actions button { flex:1; padding:13px; min-height:52px; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; border:1.5px solid var(--vert); background:#fff; color:var(--vert); }
  .actions button.plein { background:var(--vert); color:#fff; }
  .alerte { background:#FDECEA; border:1px solid #E5A29B; color:#7A1F17; border-radius:10px; padding:12px; margin:12px 0; font-size:14.5px; }
  .cache { display:none !important; }
  #edition { background:#FFF8E6; border:1px solid #E7C77A; border-radius:10px; padding:10px; margin-top:12px; font-size:13px; }
  #edition textarea { width:100%; height:160px; font-family:monospace; font-size:12px; }
  /* Mode édition : la carte seule, plus haute */
  body.edition #carte { height:70vh; }
  body.edition #titre-trajet, body.edition .resume, body.edition .photo,
  body.edition .etapes, body.edition .actions, body.edition #pas-de-chemin { display:none; }
</style>
</head>
<body>
<header>
  <h1>Bienvenue sur le campus</h1>
  <p id="position">Chargement…</p>
</header>
<main>
  <!-- Message d'erreur général (campus.json introuvable ou invalide) -->
  <div id="erreur" class="alerte cache"></div>

  <!-- Écran 1 : point de départ (seulement si le QR code ne l'a pas donné) -->
  <section id="vue-depart" class="cache">
    <h2>Où êtes-vous ?</h2>
    <div class="grille" id="liste-departs"></div>
  </section>

  <!-- Écran 2 : choix de la destination, sans clavier -->
  <section id="vue-choix" class="cache">
    <div id="categories"></div>
  </section>

  <!-- Écran 3 : itinéraire -->
  <section id="vue-trajet" class="cache">
    <h2 id="titre-trajet" class="titre"></h2>
    <div id="carte"></div>
    <div id="pas-de-chemin" class="alerte cache"></div>
    <div id="details">
      <div class="resume">
        <div><b id="distance"></b><span>à pied</span></div>
        <div><b id="duree"></b><span>de marche</span></div>
      </div>
      <div class="photo"><img id="photo" alt=""><p id="description"></p></div>
      <ol class="etapes" id="etapes"></ol>
    </div>
    <div class="actions">
      <button id="btn-autre">Autre destination</button>
      <button id="btn-depart" class="plein">Changer de départ</button>
    </div>
  </section>

  <!-- Mode édition (?edit=1) : outil pour relever les coordonnées des nœuds -->
  <div id="edition" class="cache">
    <b>Mode édition</b> : chaque clic sur le plan ajoute un point numéroté.
    Copiez les lignes ci-dessous dans <code>"noeuds"</code> de <code>data/campus.json</code>.
    Les nœuds et allées déjà définis sont affichés en gris.
    <div id="controle-graphe"></div>
    <textarea id="releves" readonly></textarea>
  </div>
</main>

<script src="vendor/leaflet.js"></script>
<script>
// =====================================================================
//  Guide du campus : tout se passe dans le navigateur, sans Internet.
//  Données : data/campus.json (plan, départs, lieux, graphe des allées)
// =====================================================================

const params = new URLSearchParams(location.search);
const EDITION = params.has("edit");        // ?edit=1 -> outil de relevé de coordonnées
const PHOTO_ABSENTE = "img/photo-absente.svg"; // image affichée si une photo manque
let D;                                     // contenu de campus.json
let carte, couche;                         // carte Leaflet et calque du trajet
let idDepart = params.get("depart");       // fourni par le QR code : ?depart=entree

const $ = (id) => document.getElementById(id);

// Affiche un seul écran à la fois
function montrer(vue) {
  ["vue-depart", "vue-choix", "vue-trajet"].forEach(v => $(v).classList.toggle("cache", v !== vue));
}

// Crée un élément HTML avec du texte (textContent : pas de risque d'injection HTML)
function el(balise, texte, classe) {
  const e = document.createElement(balise);
  if (texte !== undefined) e.textContent = texte;
  if (classe) e.className = classe;
  return e;
}

// Le plan est une image : pixel (x, y) depuis le coin haut-gauche -> coordonnées Leaflet [lat, lng]
const versLL = ([x, y]) => [D.carte.hauteur - y, x];

// ---------------------------------------------------------------------
//  Vérification de campus.json : on liste les problèmes au lieu de planter
// ---------------------------------------------------------------------
function verifierDonnees(d) {
  const pb = [];
  if (!d || typeof d !== "object") return ["le fichier ne contient pas un objet JSON"];
  const c = d.carte;
  if (!c || !c.image || !(c.largeur > 0) || !(c.hauteur > 0) || !(c.metresParPixel > 0))
    pb.push('"carte" doit contenir image, largeur, hauteur et metresParPixel');
  if (!Array.isArray(d.departs) || d.departs.length === 0) pb.push('"departs" doit être une liste non vide');
  if (!Array.isArray(d.lieux) || d.lieux.length === 0) pb.push('"lieux" doit être une liste non vide');
  if (!d.noeuds || typeof d.noeuds !== "object") pb.push('"noeuds" doit être un objet');
  if (!Array.isArray(d.aretes)) pb.push('"aretes" doit être une liste');
  if (pb.length) return pb;

  for (const [id, n] of Object.entries(d.noeuds))
    if (!Array.isArray(n.xy) || n.xy.length !== 2 || !n.xy.every(Number.isFinite))
      pb.push(`nœud "${id}" : "xy" doit être [x, y]`);
  const existe = (id) => Object.prototype.hasOwnProperty.call(d.noeuds, id);
  d.departs.forEach(x => { if (!existe(x.noeud)) pb.push(`départ "${x.id}" : nœud "${x.noeud}" inconnu`); });
  d.lieux.forEach(x => { if (!existe(x.noeud)) pb.push(`lieu "${x.id}" : nœud "${x.noeud}" inconnu`); });
  d.aretes.forEach((a, i) => {
    if (!Array.isArray(a) || a.length !== 2 || !existe(a[0]) || !existe(a[1]))
      pb.push(`arête n°${i + 1} ${JSON.stringify(a)} : nœud inconnu`);
  });
  return pb;
}

// ---------------------------------------------------------------------
//  Plus court chemin : algorithme de Dijkstra sur le graphe des allées
// ---------------------------------------------------------------------

// Liste d'adjacence : pour chaque nœud, ses voisins et la distance (en pixels)
function graphe() {
  const g = {};
  Object.keys(D.noeuds).forEach(n => g[n] = []);
  D.aretes.forEach(([a, b]) => {
    const [x1, y1] = D.noeuds[a].xy, [x2, y2] = D.noeuds[b].xy;
    const d = Math.hypot(x2 - x1, y2 - y1);   // distance euclidienne
    g[a].push([b, d]); g[b].push([a, d]);     // allée praticable dans les deux sens
  });
  return g;
}

// Renvoie { chemin: [nœuds...], pixels: longueur } ou null si aucun chemin
function plusCourtChemin(depart, arrivee) {
  const g = graphe(), dist = {}, prec = {}, vus = new Set();
  Object.keys(g).forEach(n => dist[n] = Infinity);
  dist[depart] = 0;
  while (vus.size < Object.keys(g).length) {
    // 1. Le nœud non visité le plus proche du départ
    let u = null;
    for (const n in dist) if (!vus.has(n) && (u === null || dist[n] < dist[u])) u = n;
    // 2. Plus rien d'atteignable, ou destination atteinte : on s'arrête
    if (u === null || dist[u] === Infinity || u === arrivee) break;
    vus.add(u);
    // 3. On met à jour ses voisins si passer par u est plus court
    for (const [v, w] of g[u]) if (dist[u] + w < dist[v]) { dist[v] = dist[u] + w; prec[v] = u; }
  }
  if (dist[arrivee] === Infinity) return null;
  // On remonte les prédécesseurs depuis l'arrivée pour reconstruire le chemin
  const chemin = [arrivee];
  while (chemin[0] !== depart) chemin.unshift(prec[chemin[0]]);
  return { chemin, pixels: dist[arrivee] };
}

// ---------------------------------------------------------------------
//  Carte Leaflet (plan de l'école en image, coordonnées en pixels)
// ---------------------------------------------------------------------
function initCarte() {
  if (carte) return;
  const limites = [[0, 0], [D.carte.hauteur, D.carte.largeur]];
  carte = L.map("carte", {
    crs: L.CRS.Simple,       // pas de projection géographique : de simples pixels
    minZoom: -5, maxZoom: 3, // zoom négatif = plan réduit (utile sur un écran de 360 px)
    zoomSnap: 0.25,
    maxBounds: L.latLngBounds(limites).pad(0.2),
    attributionControl: false
  });
  L.imageOverlay(D.carte.image, limites).addTo(carte);
  carte.fitBounds(limites);
  couche = L.layerGroup().addTo(carte);
}

// ---------------------------------------------------------------------
//  Écran 1 : choix du point de départ
// ---------------------------------------------------------------------
function afficherDeparts() {
  $("liste-departs").innerHTML = "";
  D.departs.forEach(d => {
    const b = el("button", d.nom, "choix");
    b.onclick = () => { idDepart = d.id; memoriserDepart(); afficherChoix(); };
    $("liste-departs").appendChild(b);
  });
  $("position").textContent = "Choisissez où vous êtes";
  montrer("vue-depart");
  window.scrollTo(0, 0);
}

// Met le départ dans l'adresse : un rechargement de la page le conserve
function memoriserDepart() {
  history.replaceState(null, "", "?depart=" + encodeURIComponent(idDepart));
}

// ---------------------------------------------------------------------
//  Écran 2 : choix de la destination (boutons regroupés par catégorie)
// ---------------------------------------------------------------------
function afficherChoix() {
  const dep = D.departs.find(d => d.id === idDepart);
  if (!dep) return afficherDeparts();   // départ absent ou inconnu dans l'URL
  $("position").textContent = "Vous êtes à : " + dep.nom;

  const cats = {};                       // { "Cours": [lieu, lieu], ... }
  D.lieux.forEach(l => (cats[l.categorie || "Autres"] ||= []).push(l));

  $("categories").innerHTML = "";
  Object.entries(cats).forEach(([cat, lieux]) => {
    const grille = el("div", undefined, "grille");
    lieux.forEach(l => {
      const b = el("button", l.nom, "choix");
      if (l.description) b.appendChild(el("small", l.description));
      b.onclick = () => afficherTrajet(l);
      grille.appendChild(b);
    });
    $("categories").append(el("h2", cat), grille);
  });
  montrer("vue-choix");
  window.scrollTo(0, 0);
}

// ---------------------------------------------------------------------
//  Écran 3 : itinéraire
// ---------------------------------------------------------------------
function afficherTrajet(lieu) {
  const dep = D.departs.find(d => d.id === idDepart);
  const r = plusCourtChemin(dep.noeud, lieu.noeud);
  montrer("vue-trajet");
  initCarte();
  carte.invalidateSize();               // la carte vient d'apparaître : Leaflet recalcule sa taille
  couche.clearLayers();
  $("titre-trajet").textContent = `${dep.nom} → ${lieu.nom}`;
  window.scrollTo(0, 0);

  // Aucun chemin : message clair, on n'affiche pas de résultat faux
  $("pas-de-chemin").classList.toggle("cache", !!r);
  $("details").classList.toggle("cache", !r);
  if (!r) {
    $("pas-de-chemin").textContent = `Désolé, aucun chemin n'a été trouvé entre « ${dep.nom} » et « ${lieu.nom} ». `
      + "Le plan des allées est incomplet : merci de prévenir les organisateurs.";
    carte.fitBounds([[0, 0], [D.carte.hauteur, D.carte.largeur]]);
    return;
  }

  // Tracé : contour blanc épais, puis ligne verte par-dessus
  const points = r.chemin.map(n => versLL(D.noeuds[n].xy));
  L.polyline(points, { color: "#FFFFFF", weight: 12, opacity: .95 }).addTo(couche);
  L.polyline(points, { color: "#1E9E4A", weight: 7 }).addTo(couche);
  // Marqueur bleu au départ, rouge à l'arrivée
  L.circleMarker(points[0], { radius: 9, color: "#fff", weight: 3, fillColor: "#2B6CB0", fillOpacity: 1 })
    .addTo(couche).bindTooltip("Vous êtes ici", { permanent: true, direction: "top" });
  L.circleMarker(points.at(-1), { radius: 10, color: "#fff", weight: 3, fillColor: "#C0392B", fillOpacity: 1 })
    .addTo(couche).bindTooltip(lieu.nom, { permanent: true, direction: "top" });
  // Zoom automatique sur le trajet (marge de 35 % pour voir les étiquettes)
  if (points.length > 1) carte.fitBounds(L.latLngBounds(points).pad(0.35));
  else carte.setView(points[0], 0);

  // Distance et temps de marche
  const metres = r.pixels * D.carte.metresParPixel;
  const vitesse = D.carte.vitesseMarcheKmh || 4.5;               // km/h
  const minutes = Math.max(1, Math.round(metres / (vitesse * 1000 / 60)));
  $("distance").textContent = Math.round(metres) + " m";
  $("duree").textContent = minutes + " min";

  // Photo du bâtiment (image de remplacement si elle manque)
  const img = $("photo");
  img.onerror = () => { img.onerror = null; img.src = PHOTO_ABSENTE; };
  img.src = lieu.photo || PHOTO_ABSENTE;
  img.alt = "Photo : " + lieu.nom;
  $("description").textContent = lieu.description || "";

  // Étapes : départ, repères nommés traversés, arrivée
  const etapes = $("etapes");
  etapes.innerHTML = "";
  const ajouterEtape = (debut, gras, fin) => {
    const li = el("li", debut);
    if (gras) li.appendChild(el("b", gras));
    if (fin) li.append(fin);
    etapes.appendChild(li);
  };
  if (r.chemin.length === 1) {
    ajouterEtape("Vous y êtes déjà : ", lieu.nom);
    return;
  }
  ajouterEtape("Partez de : ", dep.nom);
  r.chemin.slice(1, -1).map(n => D.noeuds[n].nom).filter(Boolean)
    .forEach(nom => ajouterEtape("Passez par : " + nom));
  ajouterEtape("Arrivée : ", lieu.nom, " (bâtiment de la photo)");
}

$("btn-autre").onclick = afficherChoix;
$("btn-depart").onclick = afficherDeparts;

// ---------------------------------------------------------------------
//  Mode édition : chaque clic donne les coordonnées en pixels du plan
// ---------------------------------------------------------------------
function demarrerEdition() {
  document.body.classList.add("edition");
  $("position").textContent = "Mode édition : relevé des nœuds du graphe";
  $("edition").classList.remove("cache");
  montrer("vue-trajet");
  initCarte();

  // Graphe existant en gris, pour voir ce qui est déjà tracé
  D.aretes.forEach(([a, b]) => L.polyline([versLL(D.noeuds[a].xy), versLL(D.noeuds[b].xy)],
    { color: "#6B7280", weight: 3, dashArray: "6 6" }).addTo(couche));
  Object.entries(D.noeuds).forEach(([id, n]) => L.circleMarker(versLL(n.xy),
    { radius: 4, color: "#6B7280", fillOpacity: 1 }).addTo(couche).bindTooltip(id));
  controlerGraphe();

  // Numérotation n1, n2... en sautant les noms déjà utilisés dans campus.json
  let i = 1;
  carte.on("click", e => {
    const x = Math.round(e.latlng.lng), y = Math.round(D.carte.hauteur - e.latlng.lat);
    if (x < 0 || y < 0 || x > D.carte.largeur || y > D.carte.hauteur) return; // hors du plan
    while (D.noeuds["n" + i]) i++;
    L.circleMarker(e.latlng, { radius: 6, color: "#C77D16", fillOpacity: .8 }).addTo(carte)
      .bindTooltip("n" + i, { permanent: true, direction: "right" });
    $("releves").value += `"n${i}": {"xy": [${x}, ${y}]},\n`;
    i++;
  });
}

// Vérifie que chaque lieu est atteignable depuis chaque départ (graphe connexe)
function controlerGraphe() {
  const manquants = [];
  D.departs.forEach(dep => D.lieux.forEach(l => {
    if (!plusCourtChemin(dep.noeud, l.noeud)) manquants.push(`${dep.nom} → ${l.nom}`);
  }));
  const zone = $("controle-graphe");
  zone.textContent = manquants.length
    ? "⚠ Trajets impossibles : " + manquants.join(", ")
    : "✔ Graphe connexe : tous les lieux sont atteignables depuis chaque départ.";
  zone.style.margin = "6px 0";
  zone.style.fontWeight = "600";
}

// ---------------------------------------------------------------------
//  Démarrage : chargement de campus.json
// ---------------------------------------------------------------------
function afficherErreur(texte) {
  $("position").textContent = "Le guide n'a pas pu démarrer";
  $("erreur").textContent = texte;
  $("erreur").classList.remove("cache");
  ["vue-depart", "vue-choix", "vue-trajet"].forEach(v => $(v).classList.add("cache"));
}

fetch("data/campus.json")
  .then(r => {
    if (!r.ok) throw new Error(`fichier data/campus.json introuvable (erreur HTTP ${r.status}).`);
    return r.json().catch(() => {
      throw new Error("data/campus.json n'est pas un JSON valide (virgule en trop ou manquante, guillemets…).");
    });
  })
  .then(d => {
    const problemes = verifierDonnees(d);
    if (problemes.length) throw new Error("data/campus.json contient des erreurs : " + problemes.join(" ; ") + ".");
    D = d;
    if (EDITION) demarrerEdition();
    else afficherChoix();               // affiche l'écran de départ si ?depart= est absent ou inconnu
  })
  .catch(err => {
    // Page ouverte en double-cliquant (file://) : le navigateur bloque fetch()
    const local = location.protocol === "file:"
      ? " Ouvrez la page via un serveur web (par exemple : python -m http.server 8000 dans le dossier app/)." : "";
    afficherErreur("Erreur : " + err.message + local);
  });
</script>
</body>
</html>

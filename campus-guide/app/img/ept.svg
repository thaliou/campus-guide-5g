<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="DejaVu Sans, Arial, sans-serif">
<!-- Photo provisoire de l'école : à remplacer par une vraie photo (img/ept.jpg) -->
<defs>
  <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2E6F9E"/><stop offset=".55" stop-color="#8FC1DF"/><stop offset="1" stop-color="#F6D9A8"/>
  </linearGradient>
  <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F7F1E6"/><stop offset="1" stop-color="#E4D8C3"/>
  </linearGradient>
  <linearGradient id="vitre" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9CC7E4"/><stop offset="1" stop-color="#3F7FA8"/>
  </linearGradient>
  <pattern id="fenetres" width="70" height="66" patternUnits="userSpaceOnUse">
    <rect x="10" y="12" width="50" height="40" rx="3" fill="url(#vitre)"/>
  </pattern>
</defs>
<rect width="1600" height="900" fill="url(#ciel)"/>
<circle cx="1290" cy="190" r="70" fill="#FFE7A8" opacity=".85"/>
<!-- Bâtiment principal -->
<rect x="250" y="300" width="1100" height="420" fill="url(#facade)"/>
<rect x="250" y="280" width="1100" height="30" fill="#C9B79A"/>
<rect x="280" y="330" width="420" height="330" fill="url(#fenetres)"/>
<rect x="900" y="330" width="420" height="330" fill="url(#fenetres)"/>
<!-- Entrée centrale -->
<rect x="700" y="230" width="200" height="490" fill="#EFE5D3"/>
<polygon points="680,235 800,170 920,235" fill="#0E5E45"/>
<rect x="735" y="300" width="130" height="230" rx="65" fill="url(#vitre)"/>
<rect x="740" y="560" width="120" height="160" fill="#4B3A2A"/>
<rect x="796" y="560" width="8" height="160" fill="#2F241A"/>
<!-- Mât et drapeau -->
<rect x="1420" y="300" width="8" height="420" fill="#8A939C"/>
<rect x="1428" y="305" width="90" height="20" fill="#1E9E4A"/><rect x="1428" y="325" width="90" height="20" fill="#F2D21B"/><rect x="1428" y="345" width="90" height="20" fill="#D9322B"/>
<!-- Sol et allée -->
<rect y="710" width="1600" height="190" fill="#7FA55A"/>
<polygon points="740,720 860,720 1080,900 520,900" fill="#E9DCC3"/>
<!-- Palmiers -->
<g fill="#5A3E22"><rect x="140" y="420" width="18" height="300"/><rect x="1500" y="470" width="16" height="250"/></g>
<g fill="#2F7D3A">
  <ellipse cx="110" cy="420" rx="80" ry="22" transform="rotate(-20 110 420)"/><ellipse cx="190" cy="420" rx="80" ry="22" transform="rotate(20 190 420)"/>
  <ellipse cx="150" cy="400" rx="22" ry="70" transform="rotate(5 150 400)"/>
  <ellipse cx="1470" cy="470" rx="70" ry="20" transform="rotate(-20 1470 470)"/><ellipse cx="1545" cy="470" rx="70" ry="20" transform="rotate(20 1545 470)"/>
</g>
<g fill="#3E8F45"><ellipse cx="420" cy="740" rx="120" ry="40"/><ellipse cx="1200" cy="745" rx="140" ry="42"/></g>
<text x="1580" y="885" font-size="20" text-anchor="end" fill="#FFFFFF" fill-opacity=".8">Photo provisoire : remplacer par img/ept.jpg</text>
</svg>
